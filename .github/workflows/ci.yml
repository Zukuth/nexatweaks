name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore NexaTweaks.sln

      - name: Build
        run: dotnet build NexaTweaks.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NexaTweaks.Tests/NexaTweaks.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: src/NexaTweaks.Tests/TestResults/test-results.trx
